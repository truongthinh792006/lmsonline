<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Thi Trắc Nghiệm Online</title>
    <meta name="description" content="Hệ thống thi trắc nghiệm trực tuyến dành cho học sinh.">
    <style>
        /* Thiết lập full màn hình, không có thanh cuộn thừa */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: #f0f2f5;
        }
        /* Iframe chiếm trọn màn hình */
        iframe { 
            border: none; 
            width: 100%; 
            height: 100%; 
            display: block; 
        }
    </style>
</head>
<body>
    <iframe src="https://script.google.com/macros/s/AKfycbyqYd5wIpeRrmgpX6MkL53Id3MfKF-Mo-QF6u8qFrO0tvYnfFufS16MBEfQPgTu9IEeRg/exec" allow="camera; microphone; fullscreen"></iframe>
</body>
</html>
