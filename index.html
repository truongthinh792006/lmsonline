<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Thi Trắc Nghiệm</title>
    <style>
        /* Reset CSS để iframe tràn màn hình */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; /* Ẩn thanh cuộn của trình duyệt Vercel */
            background-color: #f0f2f5;
        }

        /* Iframe chiếm trọn màn hình */
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block; 
        }

        /* Màn hình chờ khi đang tải iframe */
        #loading {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-family: sans-serif;
            color: #555;
            transition: opacity 0.5s ease;
        }
        
        /* Hiệu ứng xoay tròn */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div>Đang kết nối đến hệ thống...</div>
    </div>

    <iframe id="appFrame"></iframe>

    <script>
        // ============================================================
        // ⚠️ CẤU HÌNH: Dán Link Web App (đuôi /exec) của bạn vào đây
        // ============================================================
        const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqYd5wIpeRrmgpX6MkL53Id3MfKF-Mo-QF6u8qFrO0tvYnfFufS16MBEfQPgTu9IEeRg/exec"; 
        // ============================================================

        function initApp() {
            // Lấy tham số 'page' từ thanh địa chỉ Vercel (ví dụ: ?page=giaovien)
            const params = new URLSearchParams(window.location.search);
            const page = params.get('page');

            // Tạo link đích
            let finalSrc = GOOGLE_APPS_SCRIPT_URL;
            
            // Nếu có page thì nối thêm vào
            if (page) {
                finalSrc += (finalSrc.includes('?') ? '&' : '?') + "page=" + page;
            }

            // Gán vào iframe
            const iframe = document.getElementById('appFrame');
            iframe.src = finalSrc;

            // Khi iframe tải xong thì ẩn màn hình chờ
            iframe.onload = function() {
                const loadingDiv = document.getElementById('loading');
                loadingDiv.style.opacity = '0';
                setTimeout(() => { loadingDiv.style.display = 'none'; }, 500);
            };
        }

        // Chạy hàm khởi tạo
        initApp();
    </script>

</body>
</html>
